# Add inside the existing server {} for addons.grosst.cc.
# Keep its existing location / and BetterWatchlist routes.
location = /taste {
    return 302 /taste/configure;
}
location ^~ /taste/ {
    # No trailing slash: preserve /taste in the upstream request.
    proxy_pass http://127.0.0.1:6007;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
    client_max_body_size 8k;
    # Personal addon links and OAuth codes should not enter access logs.
    access_log off;
}
