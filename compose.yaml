services:
  taste:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/taste.sqlite
    ports:
      - "127.0.0.1:6007:3000"
    volumes:
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const p=new URL(process.env.BASE_URL).pathname.replace(/\/$/,'');const r=await fetch('http://127.0.0.1:3000'+p+'/health');process.exit(r.ok?0:1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
