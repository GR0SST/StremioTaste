<!doctype html>
<html lang="en" data-base="__BASE_PATH__">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Taste for Stremio</title>
    <link rel="stylesheet" href="__BASE_PATH__/style.css" />
    <script src="__BASE_PATH__/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a
        class="brand"
        href="__BASE_PATH__/configure"
        aria-label="Taste settings"
        ><span class="brand-mark">t.</span> taste<span class="beta"
          >FOR STREMIO</span
        ></a
      >
    </header>
    <main>
      <div class="workspace">
        <div class="setup">
          <section class="panel" aria-labelledby="trakt-heading">
            <div class="section-title">
              <span class="step">01</span>
              <h2 id="trakt-heading">Trakt</h2>
              <span class="badge" id="trakt-badge">Not connected</span>
            </div>
            <p class="notice" id="server-notice" hidden>
              Trakt is unavailable.
            </p>
            <label id="invite-label" hidden
              >Invite code<input id="invite" type="password" autocomplete="off"
            /></label>
            <button id="connect" class="button secondary" disabled>
              Connect Trakt ↗
            </button>
            <div id="device" hidden>
              <p class="muted">Activation code</p>
              <strong id="device-code"></strong>
              <p>
                <a
                  id="device-link"
                  class="button secondary"
                  target="_blank"
                  rel="noopener noreferrer"
                  >Open Trakt ↗</a
                >
              </p>
            </div>
          </section>
          <form id="settings">
            <fieldset id="settings-fields" disabled>
              <section class="panel" aria-labelledby="ai-heading">
                <div class="section-title">
                  <span class="step">02</span>
                  <h2 id="ai-heading">AI provider</h2>
                </div>
                <div class="provider-options">
                  <label class="choice"
                    ><input
                      type="radio"
                      name="provider"
                      value="openai"
                      checked
                    /><span>OpenAI</span></label
                  >
                  <label class="choice"
                    ><input
                      type="radio"
                      name="provider"
                      value="openrouter"
                    /><span>OpenRouter</span></label
                  >
                </div>
                <label for="api-key">API key</label
                ><input
                  id="api-key"
                  name="apiKey"
                  type="password"
                  autocomplete="new-password"
                  maxlength="512"
                />
                <div class="field-row">
                  <div>
                    <label for="model">Model</label>
                    <select id="model" name="model" required></select>
                    <div id="custom-model-field" hidden>
                      <label for="custom-model">Custom model ID</label>
                      <input
                        id="custom-model"
                        maxlength="200"
                        spellcheck="false"
                        disabled
                      />
                    </div>
                  </div>
                  <div>
                    <label for="language">Language</label
                    ><select id="language" name="language">
                      <option value="en">English</option>
                      <option value="ru">Russian</option>
                      <option value="uk">Ukrainian</option>
                    </select>
                  </div>
                </div>
              </section>
              <section class="panel" aria-labelledby="catalog-heading">
                <div class="section-title">
                  <span class="step">03</span>
                  <h2 id="catalog-heading">Catalogs</h2>
                </div>
                <div class="catalog-options">
                  <label class="choice"
                    ><input
                      type="checkbox"
                      name="catalogs"
                      value="taste-movies"
                      checked
                    /><span>Movies</span></label
                  >
                  <label class="choice"
                    ><input
                      type="checkbox"
                      name="catalogs"
                      value="taste-series"
                      checked
                    /><span>Series</span></label
                  >
                  <label class="choice"
                    ><input
                      type="checkbox"
                      name="catalogs"
                      value="taste-mixed"
                      checked
                    /><span>Both</span></label
                  >
                </div>
              </section>
              <div class="save-area">
                <button type="submit" class="button primary" id="save">
                  Save & generate <span aria-hidden="true">→</span>
                </button>
              </div>
            </fieldset>
          </form>
        </div>
        <section id="installation" class="panel" hidden>
          <label for="manifest-url">Install URL</label
          ><input id="manifest-url" readonly />
          <a id="install" class="button primary" href="#"
            >Install in Stremio ↗</a
          >
          <button id="copy" class="button secondary">Copy URL</button>
        </section>
      </div>
      <section class="results" id="results" hidden>
        <div class="results-heading">
          <div>
            <h2>Your picks</h2>
            <p class="muted" id="updated"></p>
          </div>
          <button class="button secondary" id="refresh">Refresh</button>
        </div>
        <div class="poster-grid" id="posters"></div>
      </section>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <footer>
        <a
          href="https://github.com/GR0SST/StremioTaste"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        ><button class="text-button" id="delete-profile" hidden>
          Delete profile
        </button>
      </footer>
    </main>
  </body>
</html>
